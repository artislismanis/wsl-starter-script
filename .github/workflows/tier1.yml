name: tier1

# Tier 1: host-free bats suite. No WSL, no mutating state. Runs on every PR
# and on pushes to main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: lint.sh self-check
        run: ./lint.sh

      - name: Run Tier 1 bats suite
        run: bats --print-output-on-failure tests/tier1/
