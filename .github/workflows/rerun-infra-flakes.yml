name: rerun-infra-flakes

# Reruns a failed tier1/tier2-3 run once when every failed job died in setup
# (WSL install, artifact download) or lost its runner (no step failed). A
# failure in a test step is never retried, so real flakes stay visible.
on:
  workflow_run:
    workflows: [tier1, tier2-3]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Rerun if only setup or runner failures
        run: |
          jobs="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs" -q '
            .jobs[] | select(.conclusion == "failure")
            | ([.steps[] | select(.conclusion == "failure") | .name][0] // "") as $step
            | "\(if $step == "" or ($step | test("^(Set up job|Set up WSL|Download base\\.tar|Restore cached base\\.tar)")) then "infra" else "test" end)\t\(.name)\t\($step)"')"
          printf '%s\n' "$jobs"
          if [ -z "$jobs" ] || grep -q '^test' <<<"$jobs"; then
            echo "A test step failed (or nothing to rerun); not retrying."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed
