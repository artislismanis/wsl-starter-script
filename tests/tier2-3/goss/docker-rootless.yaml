# Scenario 11a — DOCKER_MODE=rootless DOCKER_ROOTLESS_PASTA=1.

command:
  docker-info:
    exec: 'docker info'
    exit-status: 0

  docker-user-active:
    exec: 'systemctl --user is-active docker'
    exit-status: 0
    stdout:
      - "active"

  docker-host-set:
    exec: 'echo "$DOCKER_HOST"'
    exit-status: 0
    stdout:
      - "/^unix:///run/user/[0-9]+/docker.sock$/"

  socket-symlink:
    exec: 'readlink -f /var/run/docker.sock'
    exit-status: 0
    stdout:
      - "/^/run/user/[0-9]+/docker.sock$/"

  docker-via-well-known-path:
    exec: 'docker -H unix:///var/run/docker.sock info'
    exit-status: 0

  # Scenario 20 — ensure_block_per_shell emits *different* content into bash
  # vs zsh. Both blocks must exist, and they must not be byte-identical.
  per-shell-divergent:
    exec: |
      sed -n '/# >>> wsl-starter:docker-rootless >>>/,/# <<< wsl-starter:docker-rootless <<</p' "$HOME/.bashrc" > /tmp/bash.block
      sed -n '/# >>> wsl-starter:docker-rootless >>>/,/# <<< wsl-starter:docker-rootless <<</p' "$HOME/.zshrc"  > /tmp/zsh.block
      [ -s /tmp/bash.block ] && [ -s /tmp/zsh.block ] && ! cmp -s /tmp/bash.block /tmp/zsh.block
    exit-status: 0

file:
  /etc/tmpfiles.d/wsl-starter-docker-rootless-symlink.conf:
    exists: true

  /etc/apt/apt.conf.d/51unattended-upgrades-docker:
    exists: true

  /etc/sysctl.d/99-wsl-network.conf:
    exists: true
  /usr/local/bin/wsl-port-check:
    exists: true
    mode: "0755"

  "{{.Env.HOME}}/.bashrc":
    matches:
      - { count: { min: 1, max: 1 }, pattern: "# >>> wsl-starter:docker-rootless >>>" }

  "{{.Env.HOME}}/.config/systemd/user/docker.service.d/pasta.conf":
    exists: true
