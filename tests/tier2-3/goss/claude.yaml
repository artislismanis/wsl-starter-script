# Scenario 5 — assertions after `./install.sh --claude`.

command:
  claude:
    exec: 'claude --version'
    exit-status: 0

  settings-json-valid:
    exec: 'jq -e . "$HOME/.claude/settings.json"'
    exit-status: 0

  settings-permission-substituted:
    # The literal __PERMISSION_MODE__ marker must NOT survive into the
    # rendered file. We don't pin the chosen value here (acceptEdits vs plan
    # vs default is scenario-dependent); just assert the marker is gone.
    exec: 'grep -c __PERMISSION_MODE__ "$HOME/.claude/settings.json" || true'
    exit-status: 0
    stdout:
      - "0"

  statusline-executable:
    exec: 'test -x "$HOME/.claude/scripts/statusline.sh"'
    exit-status: 0

  statusline-renders:
    exec: |
      echo '{"model":{"display_name":"opus"},"context_window":{"used_percentage":42,"total_input_tokens":12345,"total_output_tokens":678},"rate_limits":{"five_hour":{"used_percentage":17}}}' \
        | bash "$HOME/.claude/scripts/statusline.sh"
    exit-status: 0
    stdout:
      - "/opus/"
      - "/ctx:42%/"

file:
  "{{.Env.HOME}}/.claude/CLAUDE.md":
    exists: true
  "{{.Env.HOME}}/.claude/mcp.example.json":
    exists: true
