# Assertions after `./install.sh --workbench` (run twice). Pins are read from
# the module so a bump PR doesn't have to touch this file.

command:
  # Plan check: the binaries resolve with no shell activation at all.
  herdr-pinned-without-activation:
    exec: |
      pin="$(sed -n 's/^HERDR_VERSION=\([^ ]*\).*/\1/p' "$HOME/wsl-starter-script/modules/55-workbench.sh")"
      [ -n "$pin" ] && env -i HOME="$HOME" PATH="$HOME/.local/bin:/usr/bin:/bin" herdr --version | grep -qF "$pin"
    exit-status: 0

  wt-pinned-without-activation:
    exec: |
      pin="$(sed -n 's/^WT_VERSION=\([^ ]*\).*/\1/p' "$HOME/wsl-starter-script/modules/55-workbench.sh")"
      [ -n "$pin" ] && env -i HOME="$HOME" PATH="$HOME/.local/bin:/usr/bin:/bin" wt --version | grep -qF "$pin"
    exit-status: 0

  hunk-pinned-without-activation:
    exec: |
      pin="$(sed -n 's/^HUNK_VERSION=\([^ ]*\).*/\1/p' "$HOME/wsl-starter-script/modules/55-workbench.sh")"
      [ -n "$pin" ] && env -i HOME="$HOME" PATH="$HOME/.local/bin:/usr/bin:/bin" hunk --version | grep -qF "$pin"
    exit-status: 0

  hunk-skill-from-binary:
    exec: 'hunk skill path hunk-review'
    exit-status: 0

  gh-stack-pinned:
    exec: |
      pin="$(sed -n 's/^GH_STACK_VERSION=\([^ ]*\).*/\1/p' "$HOME/wsl-starter-script/modules/55-workbench.sh")"
      [ -n "$pin" ] && gh stack --version | grep -qF "$pin"
    exit-status: 0

  gh-stack-skill-pinned:
    exec: |
      pin="$(sed -n 's/^GH_STACK_VERSION=\([^ ]*\).*/\1/p' "$HOME/wsl-starter-script/modules/55-workbench.sh")"
      grep -qx "    github-pinned: v$pin" "$HOME/.claude/skills/gh-stack/SKILL.md"
    exit-status: 0

  workbench-at-pin:
    exec: |
      pin="$(sed -n 's/^WORKBENCH_COMMIT=\([0-9a-f]*\).*/\1/p' "$HOME/wsl-starter-script/modules/55-workbench.sh")"
      [ "$(git -C "$HOME/.local/share/herdr-workbench" rev-parse HEAD)" = "$pin" ]
    exit-status: 0

  workbench-install-clean:
    exec: '"$HOME/.local/share/herdr-workbench/install.sh" --check'
    exit-status: 0

  # The block only went through tomllib in herdr-workbench's CI; here the real
  # wt has to load it and see our alias.
  wt-config-loads:
    exec: 'wt config show'
    exit-status: 0

  # alias show resolves project config too, so it needs a repo to run in.
  wt-rm-alias:
    exec: 'cd "$(mktemp -d)" && git init -q && wt config alias show rm'
    exit-status: 0
    stdout: ["/wt remove/"]

  worktrunk-config-block-on-top:
    exec: 'head -1 "$HOME/.config/worktrunk/config.toml"'
    exit-status: 0
    stdout: ["# >>> herdr-workbench:worktrunk >>>"]

  bashrc-worktrunk-once:
    exec: "grep -c '# >>> wsl-starter:worktrunk >>>' $HOME/.bashrc"
    exit-status: 0
    stdout: ["1"]

file:
  "{{.Env.HOME}}/.config/worktrunk/hooks/worktree-setup":
    exists: true
    mode: "0755"
  "{{.Env.HOME}}/.config/worktrunk/hooks/sync-default-branch":
    exists: true
    mode: "0755"
