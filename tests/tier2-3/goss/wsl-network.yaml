# Scenarios 11b-2, 11c — standalone 27-wsl-network.

file:
  # Removed: this sysctl tuning collapsed throughput under WSL2 mirrored
  # networking (widened ephemeral range spans the port band WSL tracks
  # host-side for the guest). See modules/27-wsl-network.sh and
  # tests/manual/diagnose-27-network.sh.
  /etc/sysctl.d/99-wsl-network.conf:
    exists: false
  /usr/local/bin/wsl-port-check:
    exists: true
    mode: "0755"

command:
  rshared-enabled:
    exec: 'systemctl is-enabled wsl-rshared-root.service'
    exit-status: 0
    stdout:
      - "/enabled|static/"

  port-check-runs-no-args:
    exec: 'wsl-port-check'
    exit-status: 0

  port-check-runs-with-port:
    # bind() probe — exits 0 if free or if the listener is identified.
    exec: 'wsl-port-check 22 || true'
    exit-status: 0
