# Scenarios 3, 4 — assertions after `./install.sh --dev` as the user.
# Each rc-file marker block must appear exactly once across re-runs.

command:
  rg:        { exec: 'rg --version',         exit-status: 0 }
  fd:        { exec: 'fd --version',         exit-status: 0 }
  bat:       { exec: 'bat --version',        exit-status: 0 }
  eza:       { exec: 'eza --version',        exit-status: 0 }
  gh:        { exec: 'gh --version',         exit-status: 0 }
  zsh:       { exec: 'zsh --version',        exit-status: 0 }
  # Plain exec: proves git can reach delta without mise activation.
  delta:     { exec: 'delta --version',      exit-status: 0 }
  atuin:     { exec: 'atuin --version',      exit-status: 0 }
  zoxide:    { exec: 'zoxide --version',     exit-status: 0 }
  mise:      { exec: 'mise --version',       exit-status: 0 }
  # mise-managed tools. `mise exec` because goss's shell doesn't source the
  # rc-files that run `mise activate`. azure-cli is deliberately left out of
  # dev.ps1's MISE_TOOLS (slow pipx install on every modules/** PR).
  lazygit:   { exec: 'mise exec -- lazygit --version',   exit-status: 0 }
  zellij:    { exec: 'mise exec -- zellij --version',    exit-status: 0 }
  fzf:       { exec: 'mise exec -- fzf --version',       exit-status: 0 }
  yq:        { exec: 'mise exec -- yq --version',        exit-status: 0 }
  pre-commit: { exec: 'mise exec -- pre-commit --version', exit-status: 0 }
  glow:      { exec: 'mise exec -- glow --version',      exit-status: 0 }
  terraform: { exec: 'mise exec -- terraform version',   exit-status: 0 }
  databricks: { exec: 'mise exec -- databricks --version', exit-status: 0 }
  git-spice: { exec: 'mise exec -- git-spice --version', exit-status: 0 }
  worktrunk: { exec: 'mise exec -- wt --version',        exit-status: 0 }
  plannotator: { exec: 'mise exec -- plannotator --version', exit-status: 0 }
  uv:        { exec: 'mise exec -- uv --version',        exit-status: 0 }
  # Supply chain: every global mise tool is installed at exactly the version
  # 40-mise requested (Tier 1 pins.bats keeps every request an exact pin).
  mise-installed-as-pinned:
    exec: "mise ls --global --json | jq -e '[.[][] | select(.installed != true or .requested_version != .version)] | length == 0'"
    exit-status: 0
  # And the binaries report those pins, read from the module itself so a
  # bump PR doesn't have to touch this file.
  worktrunk-pinned:
    exec: |
      pin="$(sed -n 's/.*MISE_WORKTRUNK_VERSION:-\([^}]*\)}.*/\1/p' "$HOME/wsl-starter-script/modules/40-mise.sh")"
      [ -n "$pin" ] && mise exec -- wt --version | grep -qF "$pin"
    exit-status: 0
  plannotator-pinned:
    exec: |
      pin="$(sed -n 's/.*MISE_PLANNOTATOR_VERSION:-\([^}]*\)}.*/\1/p' "$HOME/wsl-starter-script/modules/40-mise.sh")"
      [ -n "$pin" ] && mise exec -- plannotator --version | grep -qF "$pin"
    exit-status: 0
  worktrunk-hook-executable:
    exec: 'test -x "$HOME/.config/worktrunk/wsl-starter-setup.sh"'
    exit-status: 0
  worktrunk-config-worktree-path:
    exec: "grep -F 'worktree-path = \"~/worktrees/' $HOME/.config/worktrunk/config.toml"
    exit-status: 0
  zshrc-worktrunk-once:
    exec: "grep -c '# >>> wsl-starter:worktrunk >>>' $HOME/.zshrc"
    exit-status: 0
    stdout: ["1"]
  uv-venv-auto:
    exec: "mise settings get python.uv_venv_auto"
    exit-status: 0
    stdout: ["source"]
  gitconfig-delta-pager:
    exec: "git config --global --get core.pager"
    exit-status: 0
    stdout: ["delta"]
  zshrc-fzf-once:
    exec: "grep -c '# >>> wsl-starter:fzf >>>' $HOME/.zshrc"
    exit-status: 0
    stdout: ["1"]
  bashrc-git-spice-once:
    exec: "grep -c '# >>> wsl-starter:git-spice >>>' $HOME/.bashrc"
    exit-status: 0
    stdout: ["1"]

  # Idempotence: each marker block appears exactly once after re-run.
  bashrc-atuin-once:
    exec: "grep -c '# >>> wsl-starter:atuin-zoxide >>>' $HOME/.bashrc"
    exit-status: 0
    stdout: ["1"]
  bashrc-mise-once:
    exec: "grep -c '# >>> wsl-starter:mise >>>' $HOME/.bashrc"
    exit-status: 0
    stdout: ["1"]
  zshrc-atuin-once:
    exec: "grep -c '# >>> wsl-starter:atuin-zoxide >>>' $HOME/.zshrc"
    exit-status: 0
    stdout: ["1"]

  # Scenario 20 — ensure_block_per_shell emits *different* content into bash
  # vs zsh for shells that initialize differently (atuin/zoxide register
  # `atuin init bash` vs `atuin init zsh`). Both blocks must exist and must
  # not be byte-identical. (The docker-rootless block uses ensure_block_in_rcs
  # — same content both sides — so isn't the right target for this check.)
  atuin-block-per-shell-divergent:
    exec: |
      sed -n '/# >>> wsl-starter:atuin-zoxide >>>/,/# <<< wsl-starter:atuin-zoxide <<</p' "$HOME/.bashrc" > /tmp/bash.block
      sed -n '/# >>> wsl-starter:atuin-zoxide >>>/,/# <<< wsl-starter:atuin-zoxide <<</p' "$HOME/.zshrc"  > /tmp/zsh.block
      [ -s /tmp/bash.block ] && [ -s /tmp/zsh.block ] && ! cmp -s /tmp/bash.block /tmp/zsh.block
    exit-status: 0

file:
  "{{.Env.HOME}}/.bashrc":
    exists: true
  # ~/.zshrc may not exist on a minimal image until oh-my-zsh runs; the dev
  # module installs both. Treat missing as a hard failure here.
  "{{.Env.HOME}}/.zshrc":
    exists: true
