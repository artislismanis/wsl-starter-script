# Scenario 1 — assertions after `./install.sh --base` + reopen.
# Run with: TEST_USER=tester TEST_HOST=testbox goss -g base.yaml validate

user:
  "{{.Env.TEST_USER}}":
    exists: true
    groups:
      - sudo

file:
  /etc/wsl.conf:
    exists: true
    contains:
      - "# >>> wsl-starter:boot >>>"
      - "# >>> wsl-starter:user >>>"
      - "# >>> wsl-starter:network >>>"
      - "# >>> wsl-starter:interop >>>"
      - "# >>> wsl-starter:automount >>>"

command:
  # Each marker block must appear exactly once (idempotence proof).
  wsl-conf-boot-once:
    exec: "grep -c '# >>> wsl-starter:boot >>>' /etc/wsl.conf"
    exit-status: 0
    stdout: ["1"]
  wsl-conf-user-once:
    exec: "grep -c '# >>> wsl-starter:user >>>' /etc/wsl.conf"
    exit-status: 0
    stdout: ["1"]
  wsl-conf-network-once:
    exec: "grep -c '# >>> wsl-starter:network >>>' /etc/wsl.conf"
    exit-status: 0
    stdout: ["1"]
  wsl-conf-interop-once:
    exec: "grep -c '# >>> wsl-starter:interop >>>' /etc/wsl.conf"
    exit-status: 0
    stdout: ["1"]
  wsl-conf-automount-once:
    exec: "grep -c '# >>> wsl-starter:automount >>>' /etc/wsl.conf"
    exit-status: 0
    stdout: ["1"]

  # WSL_ISOLATE defaults to yes: after reopen, no Windows interop and no /mnt/c.
  # Newer WSL + systemd registers the binfmt entry as WSLInterop-late.
  interop-disabled:
    exec: "test -e /proc/sys/fs/binfmt_misc/status && test ! -e /proc/sys/fs/binfmt_misc/WSLInterop && test ! -e /proc/sys/fs/binfmt_misc/WSLInterop-late"
    exit-status: 0
  # TEMP diagnostic: never matches, so goss prints the actual output.
  binfmt-diag:
    exec: 'for f in /proc/sys/fs/binfmt_misc/*; do echo "$f: $(head -1 "$f" 2>&1)"; done; echo "WSL_INTEROP=${WSL_INTEROP:-unset}"; ls -la /run/WSL 2>&1 | head; grep -A3 "^\[interop\]" /etc/wsl.conf; cat /proc/sys/fs/binfmt_misc/WSLInterop* 2>&1'
    exit-status: 0
    stdout:
      - "__diagnostic_never_matches__"
  mnt-c-not-mounted:
    exec: "! mountpoint -q /mnt/c"
    exit-status: 0

  hostname:
    exec: 'hostname'
    exit-status: 0
    stdout:
      - "{{.Env.TEST_HOST}}"

  systemd-active:
    exec: 'systemctl is-system-running || true'
    exit-status: 0
    stdout:
      - "/running|degraded/"

  # Reopen-as-user check: this command is meaningful only when goss is invoked
  # as the new user after `wsl --terminate`.
  whoami-is-target-user:
    exec: 'whoami'
    exit-status: 0
    stdout:
      - "{{.Env.TEST_USER}}"
